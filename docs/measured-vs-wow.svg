<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .teal { fill: #1b7d6e; }
      .rust { fill: #b8431f; }
      .big  { font-weight: 800; letter-spacing: -0.02em; }
      .lbl  { fill: #51605a; font-weight: 700; }
      .mut  { fill: #8a988f; font-weight: 700; }
      .body { fill: #2b3a35; font-weight: 400; }
      .bold { fill: #2b3a35; font-weight: 800; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="988" height="440" rx="18" fill="#ffffff" stroke="#e3e8e6" stroke-width="2"/>

  <!-- hero numbers -->
  <text x="48"  y="150" class="big teal" font-size="104">236</text>
  <text x="240" y="118" class="lbl" font-size="21">ownership layer</text>
  <text x="240" y="146" class="lbl" font-size="21">correct</text>
  <text x="426" y="140" class="mut" font-size="30">vs</text>
  <text x="494" y="150" class="big rust" font-size="104">23</text>
  <text x="622" y="118" class="lbl" font-size="21">WoW, read as</text>
  <text x="622" y="146" class="lbl" font-size="21">ownership: correct</text>

  <!-- sentence -->
  <text x="48" y="222" class="body" font-size="26">On the <tspan class="bold">259 pairs where the two disagree about</tspan></text>
  <text x="48" y="258" class="body" font-size="26"><tspan class="bold">ownership,</tspan> the ownership layer is right 236 times; WoW's</text>
  <text x="48" y="294" class="body" font-size="26">portfolio, read as ownership, 23 — <tspan class="bold">p &lt; 0.001</tspan> (McNemar).</text>

  <!-- stacked bar (236/259 = 91% teal, 23/259 = 9% rust) -->
  <g>
    <rect x="48" y="320" width="864" height="26" rx="6" class="rust"/>
    <rect x="48" y="320" width="787" height="26" rx="6" class="teal"/>
  </g>

  <!-- legend -->
  <g class="mono" font-size="18">
    <rect x="48" y="366" width="15" height="15" rx="3" class="teal"/>
    <text x="72" y="379" class="lbl">Ownership layer correct · 236 (91%)</text>
    <rect x="490" y="366" width="15" height="15" rx="3" class="rust"/>
    <text x="514" y="379" class="lbl">WoW read as ownership · 23 (9%)</text>
  </g>

  <!-- stat tiles -->
  <g>
    <rect x="48"  y="398" width="212" height="40" rx="8" fill="#f1f4f2"/>
    <rect x="272" y="398" width="212" height="40" rx="8" fill="#f1f4f2"/>
    <rect x="496" y="398" width="212" height="40" rx="8" fill="#f1f4f2"/>
    <rect x="720" y="398" width="224" height="40" rx="8" fill="#f1f4f2"/>
    <text x="64"  y="417" class="bold" font-size="17">512</text>
    <text x="64"  y="432" class="mono" font-size="12" fill="#8a988f">adjudicated pairs</text>
    <text x="288" y="417" class="bold" font-size="17">259</text>
    <text x="288" y="432" class="mono" font-size="12" fill="#8a988f">systems disagree</text>
    <text x="512" y="417" class="bold" font-size="17">κ = 0.89</text>
    <text x="512" y="432" class="mono" font-size="12" fill="#8a988f">annotator agreement</text>
    <text x="736" y="417" class="bold" font-size="17">p &lt; 0.001</text>
    <text x="736" y="432" class="mono" font-size="12" fill="#8a988f">McNemar (two-sided)</text>
  </g>
</svg>
