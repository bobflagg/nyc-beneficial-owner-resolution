<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .teal { fill: #1b7d6e; }
      .rust { fill: #b8431f; }
      .title { fill: #2b3a35; font-weight: 800; }
      .sub   { fill: #51605a; font-weight: 400; }
      .lbl   { fill: #2b3a35; font-weight: 700; }
      .mut   { fill: #8a988f; font-weight: 400; }
      .val   { fill: #ffffff; font-weight: 800; }
      .grid  { stroke: #e3e8e6; stroke-width: 1; }
      .whisk { stroke: #0f3d36; stroke-width: 2.5; fill: none; }
      .mono  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="6" y="6" width="988" height="428" rx="18" fill="#ffffff" stroke="#e3e8e6" stroke-width="2"/>

  <text x="40" y="62" class="title" font-size="30">Precision by link type</text>
  <text x="40" y="94" class="sub" font-size="19">Share of asserted links judged correct · 95% intervals · stratified sample of 392 pairs · recall not estimated</text>

  <line class="grid" x1="330" y1="118" x2="330" y2="352"/>
  <line class="grid" x1="450" y1="118" x2="450" y2="352"/>
  <line class="grid" x1="570" y1="118" x2="570" y2="352"/>
  <line class="grid" x1="690" y1="118" x2="690" y2="352"/>
  <line class="grid" x1="810" y1="118" x2="810" y2="352"/>
  <line class="grid" x1="930" y1="118" x2="930" y2="352"/>

  <text x="40" y="146" class="lbl" font-size="22">Deed-held</text>
  <text x="40" y="168" class="mut mono" font-size="15">merge · 70 pairs</text>
  <rect class="teal" x="330" y="135" width="565" height="30" rx="4"/>
  <text x="344" y="157" class="val" font-size="19">97%</text>
  <path class="whisk" d="M 810 150 L 920 150 M 810 142 L 810 158 M 920 142 L 920 158"/>

  <text x="40" y="206" class="lbl" font-size="22">Resolved identity</text>
  <text x="40" y="228" class="mut mono" font-size="15">merge · 150 pairs</text>
  <rect class="teal" x="330" y="195" width="560" height="30" rx="4"/>
  <text x="344" y="217" class="val" font-size="19">97%</text>
  <path class="whisk" d="M 839 210 L 913 210 M 839 202 L 839 218 M 913 202 L 913 218"/>

  <text x="40" y="266" class="lbl" font-size="22">Aggregator pairs apart</text>
  <text x="40" y="288" class="mut mono" font-size="15">split · 120 pairs</text>
  <rect class="teal" x="330" y="255" width="580" height="30" rx="4"/>
  <text x="344" y="277" class="val" font-size="19">98%</text>
  <path class="whisk" d="M 859 270 L 924 270 M 859 262 L 859 278 M 924 262 L 924 278"/>

  <text x="40" y="326" class="lbl" font-size="22">Deed-linked successor</text>
  <text x="40" y="348" class="mut mono" font-size="15">merge · all 52 pairs</text>
  <rect class="rust" x="330" y="315" width="257" height="30" rx="4"/>
  <text x="344" y="337" class="val" font-size="19">71%</text>
  <path class="whisk" d="M 421 330 L 716 330 M 421 322 L 421 338 M 716 322 L 716 338"/>

  <text x="330" y="378" class="mut mono" font-size="15" text-anchor="middle">50%</text>
  <text x="450" y="378" class="mut mono" font-size="15" text-anchor="middle">60%</text>
  <text x="570" y="378" class="mut mono" font-size="15" text-anchor="middle">70%</text>
  <text x="690" y="378" class="mut mono" font-size="15" text-anchor="middle">80%</text>
  <text x="810" y="378" class="mut mono" font-size="15" text-anchor="middle">90%</text>
  <text x="930" y="378" class="mut mono" font-size="15" text-anchor="middle">100%</text>

  <text x="40" y="414" class="mut" font-size="16">Deed-linked successor is a census, so its interval reflects labeling noise only. Provisional until the re-adjudication.</text>
</svg>
